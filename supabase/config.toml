[project]
id = "skbbzlwzsarmideehvmz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.api]
# The gateway accepts either a Supabase user JWT (dashboard) or an OniRoute
# API key (external apps). Both are validated by the function itself.
verify_jwt = false

[functions.embed-knowledge]
# Invoked function-to-function by `api`, which presents the service-role key.
# The worker checks that itself (`isTrustedInternalCaller`), because the
# platform's JWT check would also accept any signed-in user's token and let
# them drive ingestion directly.
verify_jwt = false
