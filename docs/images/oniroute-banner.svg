<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f2b48" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="280" fill="url(#glow)" filter="blur(60px)"/>
  <circle cx="1000" cy="160" r="260" fill="#0d9488" fill-opacity="0.12" filter="blur(70px)"/>

  <!-- Wave Shapes -->
  <path d="M0,260 C300,200 550,320 850,250 C1000,220 1120,240 1200,260 L1200,360 L0,360 Z" fill="url(#wave1)" />
  <path d="M0,280 C320,230 580,310 880,265 C1020,245 1120,260 1200,275" stroke="url(#wave2)" stroke-width="3.5" fill="none" />

  <!-- Accent Vertical Pillar Bar -->
  <rect x="100" y="90" width="8" height="150" rx="4" fill="#14b8a6" />

  <!-- Main Logo Typography -->
  <text x="130" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">OniRoute</text>
  
  <text x="132" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" letter-spacing="0.5">Intelligent AI Gateway &amp; Vector Knowledge Router</text>
  
  <text x="132" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#14b8a6" letter-spacing="0.2">Multi-Provider Failover  •  Encrypted Vault  •  Ollama Cloud &amp; Local  •  Port 1001</text>

  <!-- Network Mesh Graph Visualization on Right -->
  <g transform="translate(820, 70)">
    <!-- Connection Lines -->
    <line x1="60" y1="50" x2="160" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="60" y1="50" x2="260" y2="40" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="160" y1="100" x2="260" y2="40" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="160" y1="100" x2="100" y2="160" stroke="#2dd4bf" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="160" y1="100" x2="220" y2="170" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="260" y1="40" x2="320" y2="130" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="220" y1="170" x2="320" y2="130" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="100" y1="160" x2="220" y2="170" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="60" y1="50" x2="100" y2="160" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Nodes -->
    <circle cx="60" cy="50" r="9" fill="#2dd4bf" filter="drop-shadow(0 0 8px #2dd4bf)"/>
    <circle cx="160" cy="100" r="10" fill="#38bdf8" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <circle cx="260" cy="40" r="9" fill="#818cf8" filter="drop-shadow(0 0 8px #818cf8)"/>
    <circle cx="100" cy="160" r="9" fill="#2dd4bf" filter="drop-shadow(0 0 8px #2dd4bf)"/>
    <circle cx="220" cy="170" r="11" fill="#14b8a6" filter="drop-shadow(0 0 12px #14b8a6)"/>
    <circle cx="320" cy="130" r="9" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  </g>
</svg>
